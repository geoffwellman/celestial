name: CI

on:
  schedule:
    - cron: "17 3 * * *"   # nightly every-ref publication scan (not a PR gate)
  push:
  pull_request:
  # The release workflow runs exactly these checks before it cuts a version,
  # by calling this file rather than copying it - two definitions of "green"
  # drift, and the one nobody looks at is the release one.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and publication hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete publication history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Install test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq yq
          git config --global user.name 'Example Test Author'
          git config --global user.email 'tests@example.invalid'
          git config --global init.defaultBranch main
      - name: Run regression suite
        run: bash tests/run.sh
      - name: Run HTTP security regressions
        run: node --test tests/http-server.test.mjs
      - name: Scan source and every published local ref
        env:
          CEL_PRIVATE_PATTERNS: ${{ secrets.CEL_PRIVATE_PATTERNS }}
        run: |
          # The private vocabulary - workspace, product and employer names, real
          # ticket prefixes - lives in a repository secret, one regex per line,
          # and the scan REFUSES to run without it: a scan with generic checks
          # only let two workspace names into this tree on 2026-09-18.
          umask 077
          printf '%s\n' "$CEL_PRIVATE_PATTERNS" > "$RUNNER_TEMP/private-patterns.txt"
          # Two scans: every ref's history with the generic checks (a dirty
          # branch anywhere fails every PR), and the TREE with the private
          # vocabulary required. History predating the vocabulary is the
          # owner's to rewrite or accept; new work cannot add to it.
          # A PULL REQUEST IS JUDGED ON ITS OWN ANCESTRY (base..head), a push
          # on the pushed branch's history; the every-ref scan runs nightly
          # below. Every ref on every PR meant one dirty branch failed every
          # other PR - twice on 2026-09-18.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            python3 tools/release/hygiene.py --history "${{ github.event.pull_request.base.sha }}..HEAD"
          else
            python3 tools/release/hygiene.py --history HEAD
          fi
          python3 tools/release/hygiene.py --require-private-patterns \
            --private-patterns "$RUNNER_TEMP/private-patterns.txt"
      - name: Install checksum-verified secret scanner
        env:
          SCANNER_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$SCANNER_SHA256" "$archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan complete Git history for credentials
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --log-opts="--all" .'

  every-ref-hygiene:
    name: Every-ref publication hygiene (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan every ref's history and the tree with the vocabulary
        env:
          CEL_PRIVATE_PATTERNS: ${{ secrets.CEL_PRIVATE_PATTERNS }}
        run: |
          umask 077
          printf '%s\n' "$CEL_PRIVATE_PATTERNS" > "$RUNNER_TEMP/private-patterns.txt"
          python3 tools/release/hygiene.py --all-history
          python3 tools/release/hygiene.py --all-history --require-private-patterns \
            --private-patterns "$RUNNER_TEMP/private-patterns.txt"
