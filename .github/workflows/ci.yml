name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and publication hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete publication history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Install test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq yq
          git config --global user.name 'Example Test Author'
          git config --global user.email 'tests@example.invalid'
          git config --global init.defaultBranch main
      - name: Run regression suite
        run: bash tests/run.sh
      - name: Scan source and every published local ref
        run: python3 tools/release/hygiene.py --all-history
      - name: Install checksum-verified secret scanner
        env:
          SCANNER_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$SCANNER_SHA256" "$archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan complete Git history for credentials
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --log-opts="--all" .'
