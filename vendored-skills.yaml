    # GoogleChrome/modern-web-guidance --skill modern-web-guidance`) writes
    # this directory - SKILL.md and guides/ - into one project; that SKILL.md
    # then fetches the CLI with `npx modern-web-guidance@latest` on every use.
    # The CLI and the search index it reads ship only in the npm package, so
    # they come from the published 1.0.1 tarball (built from
    # GoogleChrome/modern-web-guidance-src at its gitHead), fetched at
    # install: the index is 9 MB of embeddings plus an English vocabulary list
    # that the private-vocabulary scan cannot tell from private names. The
    # patch runs that CLI in place: offline, pinned, telemetry off.
