# Third-party skills vendored into core/skills/<name>/ and linked into every
# runtime (claude, omp, pi, codex, opencode) exactly like the plane's own core
# skills - or, with `set:`, into core/workspace-skills/<name>/ and reached
# only by the agents of workspaces that opt into that set. Each is pinned like
# optional-plugins.yaml: an exact upstream commit, never a branch, tag or
# @latest. The directory name is the upstream frontmatter `name` (OpenCode
# and pi require the two to match).
#
# GitHub inputs are COMMITTED, so an agent reads reviewed bytes on every box
# with no network. npm inputs are FETCHED AT INSTALL (`cel setup`,
# `cel update`: lib/link.sh fetch_vendored_skills) into the same directory,
# gitignored: the tarball must match its sha512 integrity and every file its
# sha256 below, and files already present with that hash are kept, so a box
# that has installed once works offline.
#
#   repo / commit / path   the upstream directory, copied whole
#   license                MIT or Apache-2.0 only; anything else is refused
#   license_files          where the licence text sits in the vendored copy
#   extra                  more pinned inputs: a file or directory from another
#                          commit (committed), or named files from an npm
#                          tarball (fetched at install; `files` pins each)
#   patch                  the plane's own edit, a zero-fuzz unified diff
#   set                    optional: the skill set it belongs to. A workspace
#                          opts into sets with workspace.yaml `skill_sets:`;
#                          cel ws sync links their skills into its .cel/skills
#                          and every launch there names that directory
#                          (agents.yaml workspace_skills). Absent: every agent.
#   sha256                 digest of the committed tree (tools/skills/vendor.py)
#
# Offline check (tests/vendored-skills.test.sh): python3 tools/skills/vendor.py check
# Re-fetch every pin and compare byte for byte: python3 tools/skills/vendor.py verify
# Move a pin: edit it, then python3 tools/skills/vendor.py sync <name>
# Sets: cloudflare (Workers, Durable Objects, Wrangler, Agents SDK, profiling,
# web performance) and expo (Expo Router, Expo UI, EAS).
# Pins read from GitHub and npm on 2026-11-21.
skills:
  web-design-guidelines:
    repo: vercel-labs/agent-skills
    commit: 5a37a6329fbad3666c3207392a6a7c0110e92efb
    path: skills/web-design-guidelines
